3:['Peito + ombros + tríceps + core','Supino reto|3|8–12|;Supino inclinado com halteres|3|8–12|;Crucifixo/voador|2|12–15|Máquina ou halteres;Desenvolvimento de ombros na máquina|3|8–12|;Elevação lateral com halteres|3|12–15|;Tríceps francês|3|10–12|Halter;Extensão de tríceps acima da cabeça|2|10–12|Sem cabo;Prancha|3|20–45 s|Sem prender a respiração'],
4:['Posterior + glúteos + panturrilha + core','Stiff/RDL|3|8–12|Coluna neutra;Mesa flexora|3|10–15|;Hip thrust|3|8–12|;Agachamento sumô|3|8–12|;Flexora unilateral|2|10–15|;Abdutora|2|12–15|;Panturrilha em pé|4|8–12|;Panturrilha sentada|4|12–15|;Dead bug|3|8–12/lado|'],
5:['Ombros + braços + panturrilha','Desenvolvimento de ombros na máquina|3|6–10|;Elevação lateral com halteres|4|10–15|;Arnold press|3|8–12|;Crucifixo inverso com halteres|3|12–15|;Elevação lateral sentada|2|12–15|;Encolhimento com halteres|3|10–15|;Rosca martelo|3|10–12|;Tríceps francês|3|10–12|;Rosca alternada|2|10–12|;Tríceps testa com halteres|2|10–12|;Panturrilha|3|10–15|']};
const EX={};for(const d in W)EX[d]={g:W[d][0],e:W[d][1].split(';').map(s=>{const a=s.split('|');return{n:a[0],s:a[1],r:a[2],o:a[3]}})};
const GR={fruta:['banana','maçã','laranja','mamão','outra fruta disponível'],prot:['ovos','frango','carne','peixe','outra fonte de proteína'],carb:['arroz','batata','mandioca','macarrão','outra fonte de carboidrato'],lac:['iogurte natural','leite'],pao:['pão','tapioca','batata cozida'],rec:['frango','ovo','queijo']};

['m1','05:00','Pré-treino','🍌','r1',[['Banana','1 unidade','fruta'],['Iogurte natural ou leite','1 pote / 1 copo','lac']]],
['m2','07:00','Café / pós-treino','🥚','r14',[['Ovos','2–3 unidades','prot'],['Pão','1–2 fatias','pao'],['Fruta','1 porção','fruta'],['Leite ou iogurte','1 copo / pote','lac']]],
['m3','10:00','Lanche','🍎','r5',[['Fruta','1 porção','fruta'],['Iogurte natural','1 pote','lac']]],
['m4','13:00','Almoço','🍛','r7',[['Arroz','3–4 colheres de sopa','carb'],['Feijão','1 concha',''],['Frango / carne / ovos','1 porção da palma da mão','prot'],['Legumes e salada','à vontade',''],['Fruta','1 porção','fruta']]],
['m5','16:00','Lanche','🥪','r3',[['Sanduíche de frango / ovo / queijo','1 unidade','rec'],['Fruta','1 porção','fruta']]],

const R=[
['r1','Overnight oats com banana','pre',5,'Fácil','1 porção',[['aveia','½ xícara'],['leite','¾ xícara (ou iogurte)'],['banana','1'],['canela','a gosto']],'Misture aveia e leite num pote e leve à geladeira de um dia para o outro. Cubra com banana fatiada e canela.'],
['r2','Omelete com queijo e tomate','cafe',10,'Fácil','1 porção',[['ovo','3'],['queijo','2 fatias'],['tomate','½']],'Bata os ovos, despeje na frigideira untada, adicione queijo e tomate, dobre e doure dos dois lados.'],
['r3','Sanduíche de frango','lan',10,'Fácil','1 porção',[['pão','2 fatias'],['frango','4 col. sopa desfiado'],['tomate','3 fatias'],['folhas','a gosto']],'Monte o pão com o frango desfiado, tomate e folhas.'],

['r5','Iogurte natural com aveia e frutas','lan',3,'Fácil','1 porção',[['iogurte','1 pote'],['aveia','2 col. sopa'],['fruta','1 porção picada']],'Misture tudo no pote ou copo. Sem açúcar ou mel.'],
['r6','Panqueca de banana e aveia','cafe',12,'Fácil','2 panquecas',[['banana','1 madura'],['ovo','1'],['aveia','4 col. sopa'],['canela','a gosto']],'Amasse a banana, misture ovo e aveia. Doure colheradas em frigideira antiaderente.'],
['r7','Arroz, feijão, frango e legumes','alm',30,'Fácil','1 prato',[['arroz','4 col. sopa'],['feijão','1 concha'],['frango','1 filé'],['legumes','1 prato de salada/cozidos']],'Grelhe o frango temperado com sal e ervas. Sirva com arroz, feijão e legumes.'],
['r8','Bowl de frango com batata','pos',30,'Média','1 porção',[['frango','150 g'],['batata','1 média'],['legumes','1 xícara'],['azeite','1 fio']],'Asse ou cozinhe a batata em cubos. Grelhe o frango em tiras. Monte o bowl com legumes e azeite.'],
['r9','Tapioca com ovo e queijo','pos',10,'Fácil','1 unidade',[['tapioca','4 col. sopa'],['ovo','1'],['queijo','1 fatia']],'Espalhe a goma na frigideira quente até unir. Recheie com ovo mexido e queijo e dobre.'],
['r10','Mingau de aveia com banana','noi',8,'Fácil','1 porção',[['aveia','3 col. sopa'],['leite','1 xícara'],['banana','1'],['canela','a gosto']],'Cozinhe aveia e leite mexendo até engrossar. Finalize com banana e canela.'],
['r11','Salada de frango','alm',15,'Fácil','1 porção',[['frango','120 g cozido'],['folhas','a gosto'],['tomate','1'],['azeite','1 fio']],'Desfie o frango e misture com folhas e tomate. Tempere com azeite e sal.'],
['r12','Wrap de frango para levar','lev',12,'Fácil','1 unidade',[['pão','1 wrap ou pão sírio'],['frango','4 col. sopa'],['queijo','1 fatia'],['folhas','a gosto']],'Recheie, enrole firme e embale em papel-alumínio. Leve em recipiente.'],
['r13','Batata recheada com frango','alm',40,'Média','1 porção',[['batata','1 grande'],['frango','4 col. sopa'],['queijo','2 fatias'],['azeite','1 fio']],'Asse a batata até amaciar, abra, recheie com frango e queijo e leve ao forno por 5 min.'],
['r14','Ovos mexidos com pão','pos',8,'Fácil','1 porção',[['ovo','2–3'],['pão','1–2 fatias'],['azeite','1 fio']],'Mexa os ovos em fogo baixo com um fio de azeite até cozinhar. Sirva com o pão.'],
['r15','Smoothie de fruta sem açúcar adicionado','doce',5,'Fácil','1 copo',[['fruta','1 porção'],['banana','½'],['leite','1 copo (ou iogurte)']],'Bata tudo no liquidificador. A banana madura já adoça.']
].map(a=>({id:a[0],n:a[1],c:a[2],t:a[3],d:a[4],y:a[5],i:a[6],p:a[7]}));
const BASE=[['Ovos 30 un','🥩 Proteínas'],['Frango 1,5–2 kg','🥩 Proteínas'],['Carne/peixe 500 g–1 kg','🥩 Proteínas'],['Iogurte natural 7–10 un','🥛 Laticínios'],['Leite 2–3 L','🥛 Laticínios'],['Queijo 300–500 g','🥛 Laticínios'],['Arroz 2 kg','🍚 Carboidratos'],['Feijão 1 kg','🍚 Carboidratos'],['Aveia 500 g','🍚 Carboidratos'],['Pão 2 pacotes','🍚 Carboidratos'],['Batata/mandioca 1 kg','🍚 Carboidratos'],['Banana 1 cacho','🍎 Frutas'],['Maçã/laranja/tangerina 1–2 kg','🍎 Frutas'],['Folhas 1–2 maços','🥦 Verduras e legumes'],['Tomate/cenoura/brócolis/abobrinha','🥦 Verduras e legumes'],['Amendoim/castanhas sem açúcar','🥜 Gorduras'],['Azeite 1 frasco','🥜 Gorduras']];
const CHK=['Treino / movimento','Refeições regulares','Sem açúcar adicionado','Hidratação regular','Sono / descanso'];
const SA=[['✅ Pode entrar normalmente','Frutas inteiras, leite, iogurte natural, arroz, feijão, batata, mandioca, pães e massas, legumes, verduras, ovos, frango, carne, peixe, aveia'],['⚠️ Atenção ao rótulo','Pão, iogurtes aromatizados, achocolatados, cereais, barras, molhos, sucos de caixinha, castanhas e amendoim (preferir sem açúcar)'],['❌ Evitar no dia a dia','Refrigerante comum, bebidas açucaradas, doces, balas, chocolates muito açucarados, bolacha recheada, bolos e sobremesas açucaradas, cereais açucarados, café com açúcar, xaropes e mel']];
const ACH=[['🏆','Primeiro treino',s=>wk(s)>=1],['🔥','5 treinos',s=>wk(s)>=5],['🔥','10 treinos',s=>wk(s)>=10],['💪','Primeiro aumento de carga',s=>up(s)>0],['📅','Primeira semana completa',s=>wkFull(s)],['🥗','7 dias registrando refeições',s=>Object.values(s.done).filter(d=>d.m&&Object.keys(d.m).length).length>=7],['💧','7 dias acompanhando hidratação',s=>Object.keys(s.water).length>=7]];
const tk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let S={done:{},water:{},bottle:750,goal:3000,wl:{},plan:{},plates:[],bpics:[],exsub:{},times:{},logs:[],rec:{},chk:{},fav:{r:[],e:[]},shop:[],sub:{},name:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('ritmo')||'{}'))}catch(e){}

const r=S.rec[k]||{};h+=`<div class="card"><h3>Como estou</h3>`+[['e','Energia'],['s','Sono'],['d','Dor muscular'],['h','Humor']].map(([c,l])=>`<div class="row sp" style="margin-top:6px"><small>${l}</small><span>${[1,2,3,4,5].map(n=>`<button class="chip ${r[c]===n?'on':''}" data-a="rv" data-v="${c}|${n}">${n}</button>`).join('')}</span></div>`).join('')+`</div>`;

function wlist(d){const v=V.ver[d]||'A';let e=EX[d].e.map(x=>({...x}));if(v==='B')e=e.map((x,i)=>{const a=alts(x.n,d);return{...x,n:a[i%a.length]}});if(v==='C')e=e.filter(x=>!NOQ.test(x.n)).slice(0,5);const sb=S.exsub[tk()]||{};return e.map(x=>({...x,base:x.n,n:sb[x.n]||x.n}))}
function vTreino(){const dow=curDay(),L=wlist(dow),k=tk(),t=dd(),v=V.ver[dow]||'A';
let h=`<h1>Treino</h1><div class="sc">${[1,2,3,4,5].map(d=>`<button class="chip ${d===dow?'on':''}" data-a="day" data-v="${d}">${DAYS[d].slice(0,3)}</button>`).join('')}</div><h2 style="margin-top:10px">${EX[dow].g}</h2><div class="sc">${[['A','Versão A · principal'],['B','Versão B · alternativa'],['C','⚡ Treino rápido']].map(([c,l])=>`<button class="chip ${v===c?'on':''}" data-a="ver" data-v="${c}">${l}</button>`).join('')}</div>${v==='C'?'<div class="card">⚡ Você tem aproximadamente 25 minutos. Mantive os exercícios principais do dia e deixei de fora os complementares (panturrilha, core, adutora/abdutora).</div>':''}<small>Descanso de 1–3 min. Pare se houver dor aguda, tontura ou mal-estar. Sem cabo/polia.</small>`;
h+=L.map((x,i)=>{const n=S.logs.filter(l=>l.d===k&&l.ex===x.n).length,lv=lastLoad(x.n),f=S.fav.e.includes(x.n);return `<div class="card"><div class="row sp"><h3>${x.n}</h3><button class="chip" data-a="fe" data-v="${i}">${f?'♥':'♡'}</button></div><small>${x.s} × ${x.r}${x.o?' · '+x.o:''}${x.n!==x.base?' · substituiu '+x.base:''}</small>${lv?`<div><small>Última: ${lv}</small></div>`:''}<div class="row" style="margin-top:6px"><input id="l${i}" type="number" inputmode="decimal" placeholder="kg"><input id="r${i}" type="number" inputmode="numeric" placeholder="reps"><button class="p" data-a="log" data-v="${i}">Série ${n+1}</button></div><button style="margin-top:6px" data-a="sxe" data-v="${i}">🔄 Substituir exercício</button></div>`}).join('');
return h+`<button class="p" style="width:100%;margin-top:10px;padding:14px" data-a="fin">${t.w?'Treino concluído ✓':'Concluir treino'}</button>`}
function showRec(id){const r=R.find(x=>x.id===id),E={cafe:'🥞',pre:'🍌',pos:'💪',alm:'🥗',lan:'🥪',lev:'🎒',noi:'🌙',doce:'🍫'}[r.c];modal(`<div style="font-size:64px;text-align:center;background:var(--soft);border-radius:14px;padding:14px">${E}</div><h2 style="margin-top:10px">🍳 ${r.n}</h2><div class="row"><span>⏱️ ${r.t} min</span><span>📊 ${r.d}</span><span>👥 ${r.y}</span></div><small>${CT[r.c]}</small><h3 style="margin-top:10px">Ingredientes</h3>${r.i.map(i=>`<div>${i[1]} — ${i[0]}</div>`).join('')}<h3 style="margin-top:10px">Modo de preparo</h3><p>${r.p}</p><div class="row"><button data-a="fr" data-v="${r.id}">${S.fav.r.includes(r.id)?'❤️ Favorita':'🤍 Favoritar'}</button><button data-a="aw" data-v="${r.id}">➕ Adicionar à semana</button><button class="p" data-a="addr" data-v="${r.id}">🛒 Ingredientes → compras</button></div>`)}
function act2(a,v){const k=tk();switch(a){
case'trs':S.times={};M.forEach(m=>m[1]=DEF[m[0]]);return 1;
case'bk':{const txt=JSON.stringify(S),fn='ritmo-backup-'+tk()+'.json',fl=new File([txt],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[fl]})){navigator.share({files:[fl]}).catch(()=>{})}else{const u=URL.createObjectURL(fl),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}return 0}
case'bi':document.getElementById('imp').click();return 0;
case'ovx':modal();return 0;
case'wc':{const x=toMl(document.getElementById('cw').value);if(x>0)addW(x);return 1}
case'wu':{const l=S.wl[k];if(l&&l.length)S.water[k]-=l.pop();return 1}
case'bp':document.getElementById('bf').click();return 0;
case'bo':bottleModal(+v);return 0;
case'bl':{const[i,f]=v.split('|');S.bpics[i].lvl=f;addW(Math.round(S.bottle*f));modal();return 1}
case'bdel':S.bpics.splice(+v,1);modal();return 1;
case'bc':{const x=toMl(document.getElementById('cb').value);if(x>=100&&x<=3000)S.bottle=x;return 1}
case'gs':{const x=toMl(document.getElementById('gl').value);if(x>=500&&x<=10000)S.goal=x;return 1}
case'pp':document.getElementById('pf').click();return 0;
case'pt':{const i=V.pl.items,j=i.indexOf(v);j<0?i.push(v):i.splice(j,1);plateModal();return 0}
case'pa':S.plates.push({d:k,img:V.pl.img,items:V.pl.items});V.pl=null;modal();V.tab='comida';V.sub='prato';return 1;
case'pd':V.pl=null;modal();return 0;
case'pdel':S.plates.splice(+v,1);return 1;
case'pf':V.pf[v]=!V.pf[v];return 1;
case'gen':genWeek();V.msg='Semana gerada ✓';return 1;
case'rgd':genDay(+v);V.msg='';return 1;
case'swp':{const[d,sl]=v.split('|');modal(`<h3>Trocar refeição</h3>`+R.filter(r=>PC[sl].includes(r.c)).map(r=>`<div class="card" data-a="sw" data-v="${d}|${sl}|${r.id}">${r.n}<br><small>${r.t} min · ${r.d}</small></div>`).join(''));return 0}
case'sw':{const[d,sl,id]=v.split('|');S.plan[d][sl]=id;modal();return 1}
case'aw':modal(`<h3>Adicionar à semana</h3><div class="row">${DS.map((n,d)=>`<button data-a="awd" data-v="${v}|${d}">${n}</button>`).join('')}</div>`);return 0;
case'awd':{const[id,d]=v.split('|'),r=R.find(x=>x.id===id);S.plan[d]=S.plan[d]||{};S.plan[d][SLC[r.c]]=id;modal();V.tab='comida';V.sub='sem';return 1}
case'gshop':gshop();V.tab='comida';V.sub='shop';return 1;
case'se':modal(`<h3>Editar item</h3><input id="ei" value="${esc(S.shop[v].n)}"><button class="p" style="margin-top:8px" data-a="sed" data-v="${v}">Salvar</button>`);return 0;
case'sed':{const x=document.getElementById('ei').value.trim();if(x)S.shop[v].n=x;modal();return 1}
case'ver':V.ver[curDay()]=v;return 1;
case'sxe':{const L=wlist(curDay()),x=L[v];modal(`<h3>Escolha uma variação</h3><small>Mesmo grupo muscular, sem cabo/polia.</small><div>${alts(x.base,curDay()).map(n=>`<button class="chip" data-a="exs" data-v="${v}|${n}">${n}</button>`).join('')}${x.n!==x.base?`<button class="chip" data-a="exs" data-v="${v}|">↩ Original</button>`:''}</div>`);return 0}
case'exs':{const i=v.indexOf('|'),x=wlist(curDay())[v.slice(0,i)],n=v.slice(i+1);(S.exsub[k]=S.exsub[k]||{});n?S.exsub[k][x.base]=n:delete S.exsub[k][x.base];modal();return 1}
}return 0}
const NAV=[['hoje','🏠','Hoje'],['treino','🏋️','Treino'],['comida','🍽️','Comida'],['prog','📈','Progresso'],['mais','⋯','Mais']];
function render(){const v={hoje:vHoje,treino:vTreino,comida:vComida,prog:vProg,mais:vMais}[V.tab]();document.getElementById('app').innerHTML=v;document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${V.tab===n[0]?'on':''}" data-a="go" data-v="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('')}
let rt=null;
function rest(){clearInterval(rt);let s=90;const el=document.getElementById('rtw');const f=()=>{el.innerHTML=s>0?`<button class="p" id="rt" data-a="rstop">⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</button>`:`<button class="p" id="rt" data-a="rstop">Descanso ok ✓</button>`;if(s<=0){clearInterval(rt);if(navigator.vibrate)navigator.vibrate(200)}s--};f();rt=setInterval(f,1000)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='ovx'&&e.target!==el)return;const a=el.dataset.a,v=el.dataset.v,k=tk();let r=1;
if(a==='go'){V.tab=v;window.scrollTo(0,0)}else if(a==='eat'){const m=dd().m;if(m[v])delete m[v];else m[v]=1;modal()}
else if(a==='subm'){showSub(v);return}else if(a==='sb'){const[id,i,x]=v.split('|');(S.sub[k]=S.sub[k]||{})[id+i]=x;showSub(id);save();render();return}
else if(a==='rec'){showRec(v);return}else if(a==='x'){modal();return}
else if(a==='w'){addW(+v)}else if(a==='bt'){S.bottle=+v}
else if(a==='rv'){const[c,n]=v.split('|');(S.rec[k]=S.rec[k]||{})[c]=+n}else if(a==='ck'){(S.chk[k]=S.chk[k]||{})[v]=!(S.chk[k]||{})[v]}
else if(a==='day'){V.day=+v}else if(a==='log'){const l=document.getElementById('l'+v).value,rp=document.getElementById('r'+v).value;S.logs.push({d:k,ex:wlist(curDay())[v].n,load:l,reps:rp});rest()}
else if(a==='fin'){dd().w=!dd().w}else if(a==='fe'){const n=wlist(curDay())[v].n,f=S.fav.e,i=f.indexOf(n);i<0?f.push(n):f.splice(i,1)}
else if(a==='fr'){const f=S.fav.r,i=f.indexOf(v);i<0?f.push(v):f.splice(i,1);if(document.getElementById('modal').innerHTML)showRec(v)}
else if(a==='sub'){V.sub=v}else if(a==='cat'){V.cat=v}else if(a==='hv'){const h=V.have,i=h.indexOf(v);i<0?h.push(v):h.splice(i,1)}
else if(a==='addm'){missing(R.find(x=>x.id===v)).forEach(i=>{const n=i[0]+' · '+i[1];if(!S.shop.some(s=>s.n===n))S.shop.push({n,c:CAT[i[0]]||'🧂 Outros',ok:false})})}
else if(a==='addr'){addShop(R.find(x=>x.id===v));modal();V.tab='comida';V.sub='shop'}
else if(a==='add'){const i=document.getElementById('ni');if(i.value.trim())S.shop.push({n:i.value.trim(),c:'🧂 Outros',ok:false})}
else if(a==='base'){BASE.forEach(b=>{if(!S.shop.some(s=>s.n===b[0]))S.shop.push({n:b[0],c:b[1],ok:false})})}
else if(a==='clr'){S.shop=S.shop.filter(s=>!s.ok)}else if(a==='sk'){S.shop[v].ok=!S.shop[v].ok}else if(a==='sx'){S.shop.splice(v,1)}
else if(a==='rstop'){clearInterval(rt);document.getElementById('rtw').innerHTML='';return}else r=act2(a,v);
if(r){save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;document.getElementById('res').innerHTML=res()}if(e.target.id==='nm'){S.name=e.target.value;save()}if(e.target.id==='hv2')V.hv2=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.t){if(!t.value)return;S.times[t.dataset.t]=t.value;const m=mealById(t.dataset.t);if(m)m[1]=t.value;save();return}const f=t.files&&t.files[0];if(!f)return;t.value='';if(t.id==='imp'){f.text().then(x=>{try{const o=JSON.parse(x);if(!o||typeof o!=='object'||!o.done)throw 0;localStorage.setItem('ritmo',x);location.reload()}catch(_){alert('Arquivo de backup inválido.')}});return}readImg(f,img=>{if(t.id==='bf'){S.bpics.push({d:tk(),img,lvl:null});save();render();bottleModal(S.bpics.length-1)}else{V.pl={img,items:[]};plateModal()}})});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script></body></html>
